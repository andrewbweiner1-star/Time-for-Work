<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock Out">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17140F">
<title>Clock Out</title>
<style>
  :root{
    --ink:#F3EEE3;
    --ink-dim:#B9AF9C;
    --bg:#17140F;
    --bg-raised:#1F1B14;
    --brass:#C9A227;
    --brass-dim:#7A6420;
    --ember:#B65B3D;
    --moss:#5C7A5A;
    --line:#3A3428;
    --off:#565045;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    overscroll-behavior:none;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    position:relative;
  }
  .card{ width:100%; max-width:420px; position:relative; }
  .eyebrow{
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-dim); text-align:center; margin-bottom:6px; font-weight:500;
  }
  .datestamp{ text-align:center; color:var(--ink-dim); font-size:13px; margin-bottom:28px; }

  /* Sundial */
  .dial-wrap{ position:relative; width:220px; height:220px; margin:0 auto 18px; }
  .dial-wrap svg{ width:100%; height:100%; display:block; }
  .dial-track{ fill:none; stroke:var(--line); stroke-width:10; }
  .dial-fill{
    fill:none; stroke:var(--brass); stroke-width:10; stroke-linecap:round;
    transition: stroke-dashoffset 0.6s ease;
  }
  .dial-fill.off{ stroke:var(--off); }
  .dial-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .pct{ font-family:Georgia, 'Times New Roman', serif; font-weight:700; font-size:56px; line-height:1; letter-spacing:-0.01em; }
  .pct-label{ font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.1em; margin-top:6px; }

  .status-line{ text-align:center; color:var(--ink); font-size:15px; margin-bottom:34px; min-height:20px; }
  .status-line span{ color:var(--brass); font-weight:600; }

  /* Week strip */
  .week-block{ background:var(--bg-raised); border:1px solid var(--line); border-radius:14px; padding:20px 18px 18px; }
  .week-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .week-title{ font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-dim); font-weight:600; }
  .week-pct{ font-family:Georgia, 'Times New Roman', serif; font-size:20px; font-weight:600; color:var(--ink); }
  .days{ display:flex; gap:6px; }
  .day{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .day-track{ width:100%; height:64px; background:var(--line); border-radius:6px; position:relative; overflow:hidden; }
  .day-track.blocked{ background:repeating-linear-gradient(135deg, var(--line), var(--line) 4px, #2a2519 4px, #2a2519 8px); }
  .day-fill{ position:absolute; bottom:0; left:0; right:0; height:0%; background:var(--brass-dim); transition:height 0.6s ease; }
  .day-fill.today{ background:var(--brass); }
  .day-fill.done{ background:var(--moss); }
  .day-label{ font-size:11px; color:var(--ink-dim); letter-spacing:0.04em; }
  .day-label.today{ color:var(--ink); font-weight:600; }
  .day-tag{ font-size:9px; color:var(--off); letter-spacing:0.04em; text-transform:uppercase; }

  .footer-note{ text-align:center; color:var(--ink-dim); font-size:12px; margin-top:22px; line-height:1.6; }

  /* Settings trigger - quiet, bottom corner */
  .gear-btn{
    position:fixed; bottom:18px; right:18px;
    width:38px; height:38px; border-radius:50%;
    background:var(--bg-raised); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:0.55; transition:opacity 0.2s ease;
  }
  .gear-btn:hover, .gear-btn:active{ opacity:1; }
  .gear-btn svg{ width:18px; height:18px; }

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,9,6,0.7);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--bg-raised); border:1px solid var(--line);
    border-radius:18px 18px 0 0;
    width:100%; max-width:440px;
    max-height:85dvh; overflow-y:auto;
    padding:22px 20px calc(28px + env(safe-area-inset-bottom));
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .modal-title{ font-family:Georgia, 'Times New Roman', serif; font-size:20px; font-weight:600; }
  .modal-close{
    width:30px; height:30px; border-radius:50%; background:var(--line); border:none;
    color:var(--ink); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .section-label{
    font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-dim);
    font-weight:600; margin:20px 0 10px;
  }
  .section-label:first-of-type{ margin-top:0; }
  .row{ display:flex; gap:8px; margin-bottom:10px; }
  input[type="date"], input[type="time"]{
    background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:9px 10px; font-size:14px; font-family:inherit;
    flex:1; min-width:0;
  }
  .btn{
    background:var(--brass); color:#1B1707; border:none; border-radius:8px;
    padding:9px 14px; font-size:14px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .btn:active{ opacity:0.85; }
  .btn-ghost{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer;
  }
  .list-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin-bottom:8px; font-size:14px;
  }
  .list-item .meta{ color:var(--ink-dim); font-size:12px; }
  .remove-btn{
    background:none; border:none; color:var(--ember); font-size:13px; cursor:pointer;
    padding:4px 6px;
  }
  .empty-note{ color:var(--ink-dim); font-size:13px; font-style:italic; padding:6px 2px; }

  .advanced-toggle{
    display:flex; align-items:center; gap:6px;
    color:var(--ink-dim); font-size:12px; cursor:pointer;
    margin-top:24px; padding-top:16px; border-top:1px solid var(--line);
    user-select:none;
  }
  .advanced-toggle .caret{ transition:transform 0.2s ease; font-size:10px; }
  .advanced-toggle.open .caret{ transform:rotate(90deg); }
  .advanced-body{ display:none; padding-top:4px; }
  .advanced-body.open{ display:block; }
  .hint{ color:var(--ink-dim); font-size:12px; margin-bottom:12px; line-height:1.5; }

  @media (prefers-reduced-motion: reduce){
    .dial-fill, .day-fill{ transition:none; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Clock Out</div>
  <div class="datestamp" id="datestamp">—</div>

  <div class="dial-wrap">
    <svg viewBox="0 0 220 220">
      <circle class="dial-track" cx="110" cy="110" r="95"></circle>
      <circle class="dial-fill" id="dialFill" cx="110" cy="110" r="95"
        stroke-dasharray="596.9" stroke-dashoffset="596.9"
        transform="rotate(-90 110 110)"></circle>
    </svg>
    <div class="dial-center">
      <div class="pct" id="todayPct">0%</div>
      <div class="pct-label">today</div>
    </div>
  </div>

  <div class="status-line" id="statusLine">&nbsp;</div>

  <div class="week-block">
    <div class="week-head">
      <div class="week-title">This week</div>
      <div class="week-pct" id="weekPct">0%</div>
    </div>
    <div class="days" id="days"></div>
  </div>

  <div class="footer-note" id="footerNote">9:00 – 5:30, Monday through Friday.</div>
</div>

<div class="gear-btn" id="gearBtn" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="#B9AF9C" stroke-width="1.8">
    <circle cx="12" cy="12" r="3.2"></circle>
    <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.4.6a7.6 7.6 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-.6-2 3.4L6.4 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.4-.6a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4.6 2-3.4-2-1.5z"></path>
  </svg>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Settings</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>

    <div class="section-label">Days off</div>
    <div class="hint">Mark a date as off. It's skipped entirely and won't count toward the week.</div>
    <div class="row">
      <input type="date" id="blockDateInput">
      <button class="btn" id="addBlockBtn">Add</button>
    </div>
    <div id="blockedList"></div>

    <div class="advanced-toggle" id="advToggle">
      <span class="caret">▶</span> Change hours for a specific day
    </div>
    <div class="advanced-body" id="advBody">
      <div class="hint">Override the 9:00–5:30 default for one date — useful for a half day or a late start.</div>
      <div class="row">
        <input type="date" id="customDateInput">
      </div>
      <div class="row">
        <input type="time" id="customStartInput" value="09:00">
        <input type="time" id="customEndInput" value="17:30">
      </div>
      <div class="row">
        <button class="btn" id="addCustomBtn" style="flex:1">Save override</button>
      </div>
      <div id="customList"></div>
    </div>
  </div>
</div>

<script>
  const DEFAULT_START = { h: 9, m: 0 };
  const DEFAULT_END   = { h: 17, m: 30 };
  const DAY_LABELS = ['Mon','Tue','Wed','Thu','Fri'];
  const DIAL_CIRCUMFERENCE = 2 * Math.PI * 95;
  const STORE_KEY = 'clockout_settings_v1';

  let settings = { blocked: [], custom: {} };
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) settings = JSON.parse(saved);
    if (!settings.blocked) settings.blocked = [];
    if (!settings.custom) settings.custom = {};
  } catch(e) { /* storage unavailable, run in-memory only */ }

  function persist(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch(e) {}
  }

  function isoDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }

  function hoursFor(d){
    const key = isoDate(d);
    if (settings.custom[key]) return settings.custom[key];
    return { sh: DEFAULT_START.h, sm: DEFAULT_START.m, eh: DEFAULT_END.h, em: DEFAULT_END.m };
  }

  function isBlocked(d){ return settings.blocked.includes(isoDate(d)); }

  function atTime(date, h, m){
    const d = new Date(date);
    d.setHours(h, m, 0, 0);
    return d;
  }

  function mondayOf(date){
    const d = new Date(date);
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    d.setDate(d.getDate() + diff);
    d.setHours(0,0,0,0);
    return d;
  }

  function fmtTime(h, m){
    const period = h >= 12 ? 'PM' : 'AM';
    let hh = h % 12; if (hh === 0) hh = 12;
    return hh + ':' + String(m).padStart(2,'0') + ' ' + period;
  }

  function fmtDateShort(iso){
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }

  function render(){
    const now = new Date();
    const dow = now.getDay();
    const isWeekday = dow >= 1 && dow <= 5;
    const todayBlocked = isBlocked(now);
    const th = hoursFor(now);

    const todayStart = atTime(now, th.sh, th.sm);
    const todayEnd   = atTime(now, th.eh, th.em);
    const dayLenMin  = (todayEnd - todayStart) / 60000;

    let todayPct = 0;
    let statusHtml = '';
    const dialFillEl = document.getElementById('dialFill');
    dialFillEl.classList.remove('off');

    if (!isWeekday){
      todayPct = 0;
      statusHtml = 'Weekend. <span>No clock running.</span>';
      dialFillEl.classList.add('off');
    } else if (todayBlocked){
      todayPct = 0;
      document.getElementById('todayPct').textContent = '—';
      statusHtml = '<span>Marked as a day off.</span>';
      dialFillEl.classList.add('off');
      dialFillEl.style.strokeDashoffset = DIAL_CIRCUMFERENCE;
      document.getElementById('statusLine').innerHTML = statusHtml;
      document.getElementById('datestamp').textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
      renderWeek(now);
      return;
    } else if (dayLenMin <= 0){
      todayPct = 100;
      statusHtml = '<span>No hours set for today.</span>';
    } else if (now < todayStart){
      todayPct = 0;
      statusHtml = 'Starts at <span>' + fmtTime(th.sh, th.sm) + '</span>';
    } else if (now >= todayEnd){
      todayPct = 100;
      statusHtml = '<span>Done for the day.</span>';
    } else {
      const elapsed = (now - todayStart) / 60000;
      todayPct = (elapsed / dayLenMin) * 100;
      const remainMin = Math.round(dayLenMin - elapsed);
      const rh = Math.floor(remainMin / 60), rm = remainMin % 60;
      const remainStr = (rh > 0 ? rh + 'h ' : '') + rm + 'm';
      statusHtml = '<span>' + remainStr + '</span> left today';
    }

    document.getElementById('todayPct').textContent = todayPct.toFixed(1) + '%';
    dialFillEl.style.strokeDashoffset = DIAL_CIRCUMFERENCE * (1 - todayPct/100);
    document.getElementById('statusLine').innerHTML = statusHtml;
    document.getElementById('datestamp').textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

    renderWeek(now);
  }

  function renderWeek(now){
    const dow = now.getDay();
    const isWeekday = dow >= 1 && dow <= 5;
    const monday = mondayOf(now);
    const dayInfo = [];

    for (let i = 0; i < 5; i++){
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const blocked = isBlocked(d);
      const h = hoursFor(d);
      const dStart = atTime(d, h.sh, h.sm);
      const dEnd   = atTime(d, h.eh, h.em);
      const lenMin = Math.max(0, (dEnd - dStart) / 60000);
      let p = 0;
      if (!blocked && lenMin > 0){
        if (now >= dEnd) p = 100;
        else if (now <= dStart) p = 0;
        else p = ((now - dStart) / (dEnd - dStart)) * 100;
      }
      dayInfo.push({ p: Math.max(0, Math.min(100, p)), blocked, lenMin });
    }

    const workingDays = dayInfo.filter(d => !d.blocked);
    const totalWeekMin = workingDays.reduce((s,d) => s + d.lenMin, 0);
    const elapsedWeekMin = workingDays.reduce((s,d) => s + (d.p/100) * d.lenMin, 0);
    const weekPct = totalWeekMin > 0 ? (elapsedWeekMin / totalWeekMin) * 100 : 0;
    document.getElementById('weekPct').textContent = totalWeekMin > 0 ? weekPct.toFixed(1) + '%' : '—';

    const daysEl = document.getElementById('days');
    daysEl.innerHTML = '';
    dayInfo.forEach((info, i) => {
      const isToday = isWeekday && i === (dow - 1);
      const isDone = info.p >= 100 && !info.blocked;
      const dayDiv = document.createElement('div');
      dayDiv.className = 'day';
      dayDiv.innerHTML =
        '<div class="day-track' + (info.blocked ? ' blocked' : '') + '">' +
          (info.blocked ? '' : '<div class="day-fill' + (isToday ? ' today' : (isDone ? ' done' : '')) + '" style="height:' + info.p + '%"></div>') +
        '</div>' +
        '<div class="day-label' + (isToday ? ' today' : '') + '">' + DAY_LABELS[i] + '</div>' +
        (info.blocked ? '<div class="day-tag">off</div>' : '');
      daysEl.appendChild(dayDiv);
    });
  }

  // ---------- Settings modal ----------
  const backdrop = document.getElementById('modalBackdrop');
  document.getElementById('gearBtn').addEventListener('click', () => {
    backdrop.classList.add('open');
    renderSettingsLists();
  });
  document.getElementById('modalClose').addEventListener('click', () => backdrop.classList.remove('open'));
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.classList.remove('open'); });

  document.getElementById('addBlockBtn').addEventListener('click', () => {
    const val = document.getElementById('blockDateInput').value;
    if (!val) return;
    if (!settings.blocked.includes(val)) settings.blocked.push(val);
    settings.blocked.sort();
    persist();
    document.getElementById('blockDateInput').value = '';
    renderSettingsLists();
    render();
  });

  document.getElementById('addCustomBtn').addEventListener('click', () => {
    const dateVal = document.getElementById('customDateInput').value;
    const startVal = document.getElementById('customStartInput').value;
    const endVal = document.getElementById('customEndInput').value;
    if (!dateVal || !startVal || !endVal) return;
    const [sh, sm] = startVal.split(':').map(Number);
    const [eh, em] = endVal.split(':').map(Number);
    settings.custom[dateVal] = { sh, sm, eh, em };
    persist();
    renderSettingsLists();
    render();
  });

  const advToggle = document.getElementById('advToggle');
  const advBody = document.getElementById('advBody');
  advToggle.addEventListener('click', () => {
    advToggle.classList.toggle('open');
    advBody.classList.toggle('open');
  });

  function renderSettingsLists(){
    const blockedList = document.getElementById('blockedList');
    if (settings.blocked.length === 0){
      blockedList.innerHTML = '<div class="empty-note">No days off added.</div>';
    } else {
      blockedList.innerHTML = '';
      settings.blocked.forEach(iso => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = '<span>' + fmtDateShort(iso) + '</span><button class="remove-btn" data-date="' + iso + '">Remove</button>';
        blockedList.appendChild(item);
      });
      blockedList.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          settings.blocked = settings.blocked.filter(d => d !== btn.dataset.date);
          persist();
          renderSettingsLists();
          render();
        });
      });
    }

    const customList = document.getElementById('customList');
    const customKeys = Object.keys(settings.custom).sort();
    if (customKeys.length === 0){
      customList.innerHTML = '<div class="empty-note">No overrides added.</div>';
    } else {
      customList.innerHTML = '';
      customKeys.forEach(iso => {
        const h = settings.custom[iso];
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = '<span>' + fmtDateShort(iso) +
          '<div class="meta">' + fmtTime(h.sh, h.sm) + ' – ' + fmtTime(h.eh, h.em) + '</div></span>' +
          '<button class="remove-btn" data-date="' + iso + '">Remove</button>';
        customList.appendChild(item);
      });
      customList.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          delete settings.custom[btn.dataset.date];
          persist();
          renderSettingsLists();
          render();
        });
      });
    }
  }

  render();
  setInterval(render, 30000);
</script>
</body>
</html>
